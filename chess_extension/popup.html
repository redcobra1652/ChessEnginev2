<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 230px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #eee;
      padding: 14px;
    }
    h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ff6b35;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .dot.green  { background: #4caf50; }
    .dot.red    { background: #f44336; }
    #status-text { color: #aaa; }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 7px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    #btn-toggle { background: #ff6b35; color: #fff; }
    #btn-toggle.off { background: #444; color: #aaa; }
    #btn-analyze { background: #2a6adb; color: #fff; }

    .divider {
      border: none;
      border-top: 1px solid #333;
      margin: 10px 0;
    }

    /* ── Side selector ───────────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 5px;
    }
    .side-row {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .side-btn {
      flex: 1;
      padding: 5px 4px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 0;
      border-radius: 4px;
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      cursor: pointer;
    }
    .side-btn:hover { opacity: 0.85; }
    .side-btn.active {
      background: #ff6b35;
      color: #fff;
      border-color: #ff6b35;
    }
    /* ── Sims ────────────────────────────────────────────────────── */
    .sims-row {
      margin-bottom: 10px;
    }
    .sims-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 5px;
    }
    #sims-value {
      color: #ff6b35;
      font-weight: 700;
    }
    input[type=range] {
      width: 100%;
      accent-color: #ff6b35;
      cursor: pointer;
    }
    .sims-presets {
      display: flex;
      gap: 4px;
      margin-top: 5px;
    }
    .sims-presets button {
      flex: 1;
      padding: 4px;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 0;
      border-radius: 4px;
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
    }
    .sims-presets button.active {
      background: #ff6b35;
      color: #fff;
      border-color: #ff6b35;
    }

    .hint {
      font-size: 10px;
      color: #555;
      line-height: 1.5;
    }
    .hint code {
      background: #2a2a2a;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 10px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>♟ Chess Model</h1>

  <div class="status-row">
    <div class="dot" id="server-dot"></div>
    <span id="status-text">Checking server…</span>
  </div>

  <button id="btn-toggle">● Overlay ON</button>
  <button id="btn-analyze">⚡ Analyze Now</button>

  <hr class="divider">

  <!-- Side selector -->
  <div class="section-label">Analyze for side</div>
  <div class="side-row">
    <button class="side-btn" data-side="white">♙ White</button>
    <button class="side-btn active" data-side="both">⚖ Both</button>
    <button class="side-btn" data-side="black">♟ Black</button>
  </div>

  <hr class="divider">

  <div class="sims-row">
    <div class="sims-label">
      <span>Think time</span>
      <span id="sims-value">800ms</span>
    </div>
    <input type="range" id="sims-slider" min="100" max="3000" step="100" value="800">
    <div class="sims-presets">
      <button class="preset" data-val="300">300ms</button>
      <button class="preset active" data-val="800">800ms</button>
      <button class="preset" data-val="1500">1.5s</button>
      <button class="preset" data-val="3000">3s</button>
    </div>
  </div>

  <hr class="divider">
  <p class="hint">
    Run: <code>python3 chess_server.py</code><br>
    (auto-detects nnue_engine + model.nnue)
  </p>

  <script src="popup.js"></script>
</body>
</html>
